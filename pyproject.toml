[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metaicu"
version = "0.1.0"
description = "AmsterdamUMCdb supplied-vocabulary preparation utilities"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Amir Vahdani", email = "a.m.vahdani@gmail.com" }]
dependencies = [
  "hydra-core>=1.3",
  "matplotlib>=3.7",
  "omegaconf>=2.3",
  "pandas>=2.0",
  "numpy>=1.24",
  "polars[rtcompat]>=1.0",
  "pyarrow>=14.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "safetensors>=0.5",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.16,<0.17",
]

[project.scripts]
build-amsterdam-vocab = "metaicu.aumcdb.tokenized.cli.build_amsterdam_vocab:main"
build-aumc-premeds = "metaicu.aumcdb.tokenized.cli.build_amsterdam_premeds:main"
audit-aumc-premeds = "metaicu.aumcdb.tokenized.cli.audit_amsterdam_premeds:main"
audit-aumc-tokenized = "metaicu.aumcdb.tokenized.cli.audit_amsterdam_tokenized:main"
build-aumc-meds = "metaicu.aumcdb.tokenized.cli.build_amsterdam_meds:main"
build-aumc-tokenized = "metaicu.aumcdb.tokenized.cli.build_amsterdam_tokenized:main"
retrieve-aumc-externals = "metaicu.aumcdb.tokenized.cli.retrieve_externals:main"
grid_build_manifest = "metaicu.aumcdb.grid.cli.grid_build_manifest:main"
grid_build_dataset = "metaicu.aumcdb.grid.cli.grid_build_dataset:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"metaicu.aumcdb.tokenized" = ["configs/*.yaml", "configs/vocab_scope/*.yaml", "data/*.csv"]
"metaicu.aumcdb.tokenized.vocab_pipeline" = [
  "data/policy_manifests/*.csv",
  "data/policy_manifests/*.json",
]
"metaicu.aumcdb.grid" = ["configs/*.yaml", "data/*.csv", "data/*.md"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
