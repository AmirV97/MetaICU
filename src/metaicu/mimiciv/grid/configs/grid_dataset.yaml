# Raw MIMIC-IV to iCareFM-style hourly grid.
# Minimal invocation:
#   grid_build_dataset paths.parent_dir=/path/to/workspace

paths:
  parent_dir: null
  raw_data_dir: null        # defaults to parent_dir/data/raw
  raw_shards_dir: null      # defaults to parent_dir/data/raw_shards
  output_dir: null          # defaults to parent_dir/data/grid
  audit_dir: null           # defaults to parent_dir/audits/grid_dataset
  manifest_path: null       # defaults to the packaged reviewed MIMIC-IV feature manifest
  admission_ids_file: null  # optional one-admissionid(=stay_id)-per-line bounded cohort
  external_artifacts_dir: null  # optional: another (or this same) dataset's already-built grid
                                 # output_dir -- pools this run's own per-tag stats with that
                                 # build's saved scalers.pkl/categorical_encoding.csv, weighted by
                                 # each side's sqrt(n_train_admissions) mass, instead of fitting solo

split:
  # Always by subject_id (grid.build.split.assign_splits) -- no unit_of_analysis knob here, unlike
  # aumcdb: M4_grid's shard/metadata output is unconditionally admission-grain.
  train_frac: 0.8
  val_frac: 0.1
  test_frac: 0.1

run:
  build_raw_shards: true
  rebuild_raw_shards: false
  raw_shard_rows: 5000000
  sample_size: null
  patients_per_file: 1000
  random_seed: 42  # drives admission subsampling, split assignment, and treatment
                    # (QuantileTransformer) scaler fitting -- one knob for every random component
  features: null
  reconstruction_types: null
  apply_inclusion_criteria: true
  scale: true
  impute: true
  one_hot: true
  overwrite: false
  log_level: INFO

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
